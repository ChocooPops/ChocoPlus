<div class="menu" [ngClass]="{
    'menu-visible':
      !activateTransitionFromMediaPage ||
      (isScrolled && activateTransition),

    'menu-transparent':
      activateTransitionFromMediaPage &&
      !isScrolled &&
      activateTransition,

    'enable-transition': activateTransition,
    'disable-transition': !activateTransition
  }">
    <div class="section">
        <img src="icon/choco.svg">
    </div>
</div>
<div class="menu2" #menuRowRef>
    <div class="section" #logoRef>
        <img src="icon/choco.svg">
    </div>

    @for(menuTab of menuTabs; track menuTab.id) {
    <app-menu-tab #tabRef [menuTab]="menuTab"></app-menu-tab>
    }

    @if(menuPlus.length > 0) {
    <div class="container-menu-plus" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
        <app-menu-tab [menuTab]="plusTab"></app-menu-tab>
        <div class="container-tabs-plus" [ngClass]="class">
            @for(menuTab of menuPlus; track menuTab.id) {
            <div class="container-option" (click)="tab.onClick()">
                <app-menu-tab #tab [menuTab]="menuTab" [activateUnderline]="false"></app-menu-tab>
            </div>
            }
        </div>
    </div>
    }

    <div class="container-other-tab" #otherTabRef>
        <app-navigation-button></app-navigation-button>
        <app-download-menu-button></app-download-menu-button>
        <app-change-format-poster></app-change-format-poster>
        <app-user-tab></app-user-tab>
    </div>

    <div class="container-measure-plus-tab" #plusTabMeasureRef>
        <app-menu-tab [menuTab]="plusTab"></app-menu-tab>
    </div>
</div>
