<div class="option-selector" role="radiogroup" tabindex="0" (keydown)="onKeyDown($event)">

    <div class="indicator" #indicator></div>

    @for(option of options; track option.id) {
    <button class="option" #optionRef type="button" role="radio" [attr.aria-checked]="option.id === selectedId"
        [class.option-selected]="option.id === selectedId" (click)="onSelect(option)">
        <span class="option-name"> {{ option.name | translate }} </span>
    </button>
    }
</div>
