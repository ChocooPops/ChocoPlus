<div class="container-actions" role="menu">
    <div class="header">
        <p class="label">{{ 'USER.USER_MANAGEMENT.CHANGE_ROLE' | translate }}</p>
        <p class="user-name"> {{ user.pseudo | titlecase }} </p>
    </div>
    @for(action of actionUser; track action.id) {
    <button type="button" class="item" role="menuitem" [attr.data-role]="action.value"
        [class.item-current]="action.value === user.role" [disabled]="action.value === user.role"
        (click)="onClickAction(action.value)">
        <div class="point"></div>
        <p> {{ action.name | translate }} </p>
        @if(action.value === user.role) {
        <span class="current">{{ 'USER.USER_MANAGEMENT.CURRENT_ROLE' | translate }}</span>
        }
    </button>
    }
</div>
