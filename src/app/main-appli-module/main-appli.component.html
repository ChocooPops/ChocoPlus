<div #containerRef class="container">
    <div class="wrapper">
        @if(!componentMustBeHidden) {
        <app-menu-bar></app-menu-bar>
        }
        <div class="mainContain">
            @if(mediaSelected != undefined) {
                <app-media-page></app-media-page>
            }
            <router-outlet />
        </div>
        
        @if(!componentMustBeHidden) {
            <app-footer></app-footer>
        }

    </div>
</div>

<!-- Internal video player, over the pages (full screen or mini player): playback goes on while browsing -->
@if(isPlayerOpen) {
<app-video-playing></app-video-playing>
}
