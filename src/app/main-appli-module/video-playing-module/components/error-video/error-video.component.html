<div class="error-overlay" (click)="onClickCard($event)">
    <div class="error-card" role="alertdialog">

        <div class="error-header">
            <img class="error-icon" [src]="srcWarning" alt="">
            <p class="error-title">{{ titleKey | translate }}</p>
        </div>

        @if (playerError.serverMessage) {
        <p class="error-message">{{ playerError.serverMessage }}</p>
        } @else {
        <p class="error-message">{{ messageKey | translate }}</p>
        }

        @if (playerError.detail) {
        <button class="error-details-toggle" type="button" (click)="toggleDetails()">
            <span class="error-details-arrow" [class.error-details-arrow-open]="displayDetails">›</span>
            {{ 'PLAYER.ERROR.DETAILS' | translate }}
        </button>
        @if (displayDetails) {
        <pre class="error-details">{{ playerError.detail }}</pre>
        }
        }

        <div class="error-buttons">
            <button class="error-button error-button-secondary" type="button" (click)="onClose()">
                {{ 'PLAYER.ERROR.CLOSE' | translate }}
            </button>
            <button class="error-button error-button-primary" type="button" (click)="onRetry()">
                {{ 'PLAYER.ERROR.RETRY' | translate }}
            </button>
        </div>

    </div>
</div>
