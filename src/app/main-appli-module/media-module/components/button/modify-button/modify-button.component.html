<div class="container-button"
    [class.cursor-pointer]="isConnected && cursor"
    [class.is-offline]="!isConnected"
    [attr.title]="isConnected ? ('TUTO.EDIT_METADATA' | translate) : null"
    (click)="isConnected && onClick()">
    @if (!typeButton) {
    <div class="iconWrap"
        [class.containerMovieButton]="typeDisplaying"
        [class.MovieButtonSizeIfDisplayTypeIsTrue]="!typeDisplaying">
        <img class="icon icon--leave" [src]="srcImageLeave">
        <img class="icon icon--enter" [src]="isConnected ? srcImageEnter : srcImageLeave">
    </div>
    } @else {
    <div class="largestContainerButtonGrey">
        <img [src]="modify">
        <p>{{ 'BUTTON.MODIFY' | translate }}</p>
    </div>
    }
</div>
