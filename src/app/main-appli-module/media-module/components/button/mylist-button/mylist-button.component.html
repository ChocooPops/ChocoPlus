@let leave = isInList ? srcInListLeave : srcNotListLeave;
@let enter = isInList ? srcInListEnter : srcNotListEnter;

<div class="container"
    [class.cursor-pointer]="isConnected && cursor"
    [class.is-offline]="!isConnected"
    [attr.title]="isConnected ? ((isInList ? 'TUTO.REMOVE_INTO_LIST' : 'TUTO.ADD_INTO_LIST') | translate) : null"
    (click)="onClick()">
    @if (!typeButton) {
    <div class="iconWrap"
        [class.containerMovieButton]="typeDisplaying"
        [class.MovieButtonSizeIfDisplayTypeIsTrue]="!typeDisplaying">
        <img class="icon icon--leave" [src]="leave">
        <img class="icon icon--enter" [src]="isConnected ? enter : leave">
    </div>
    } @else {
    <div class="largestContainerButtonGrey">
        <img [src]="isInList ? favoris : notFavoris">
        <p>{{ 'BUTTON.MYLIST' | translate }}</p>
    </div>
    }
</div>
