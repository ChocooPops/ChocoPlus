<div class="container-element" [style.height.px]="sprite.height" [style.top.px]="sprite.y" [style.left.px]="sprite.x">
    <div class="scroll-content" [style.--scroll-distance]="scrollDistance" [style.animation-duration.s]="scrollDuration">
        @for(item of copies; track item) {
        <img [src]="sprite.image" [style.height.px]="sprite.height" [style.width.px]="sprite.width">
        }
    </div>
</div>
