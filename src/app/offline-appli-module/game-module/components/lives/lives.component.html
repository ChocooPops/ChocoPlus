<div class="container-lives">
    <div class="hearts">
        @for(slot of slots; track slot) {
        <img class="heart" [src]="slot < lives ? srcHeart : srcDeath">
        }
    </div>
    @if(luckySeconds > 0) {
    <div class="lucky">
        <img [src]="srcLucky">
        <p>x2 · {{ luckySeconds }}s</p>
    </div>
    }
</div>
