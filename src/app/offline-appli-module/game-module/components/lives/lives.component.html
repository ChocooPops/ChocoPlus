<div class="container-lives">
    <div class="hearts">
        @for(slot of slots; track slot) {
        <svg class="heart" [class.empty]="slot >= lives" viewBox="0 0 7 6" shape-rendering="crispEdges">
            <path d="M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z" />
        </svg>
        }
    </div>
    @if(luckySeconds > 0) {
    <div class="lucky">
        <img [src]="srcLucky">
        <p>x2 · {{ luckySeconds }}s</p>
    </div>
    }
</div>
